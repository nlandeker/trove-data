name: Ingest catalog

on:
  schedule:
    # Daily at 03:00 UTC (low-traffic window)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          # ponytail: check out the data branch directly; no need for a separate fetch step

      # Code lives on main; the data branch only persists outputs. Overlay main's
      # code every run so fixes on main take effect without a manual merge — the
      # checkout stages these files, so the commit below also syncs them to data.
      - name: Sync ingest code from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- ingest.py manga_ingest.py test_ingest.py test_manga_ingest.py fixtures overrides

      - name: Run ingest pipeline
        env:
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKSET_API_KEY: ${{ secrets.BRICKSET_API_KEY }}
        run: python3 ingest.py

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          mv catalog.json data/catalog.json
          mv status.json data/status.json
          # cache/retiring_last_good.json stays at repo root — ingest.py reads it
          # from there next run; committing it is what makes it survive runs.
          git add data/catalog.json data/status.json cache/retiring_last_good.json
          git diff --cached --quiet || git commit -m "chore: refresh catalog $(date -u +%Y-%m-%d)"
          git push

      # Runs AFTER publish: the (valid, degraded) catalog still ships; this just
      # turns the run red so GitHub's failure-notification email fires.
      - name: Fail run if degraded
        run: python3 -c "import json,sys; sys.exit(1 if json.load(open('data/status.json'))['degraded'] else 0)"

      # OPTIONAL: file a tracking issue on degraded runs, deduped via label.
      # Needs `issues: write` in permissions and a `scrape-degraded` label to exist.
      # - name: Open issue on degraded run
      #   if: failure()
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
